<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow</title>
  <desc id="desc">Role-separated collaboration with controlled access to business data.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c1f2b"/></marker></defs>
  <style>text { font-family: Arial, sans-serif; } .label { font-size: 23px; font-weight: 700; fill: #48131c; } .detail { font-size: 20px; fill: #6b625b; } .eyebrow { font-size: 16px; letter-spacing: 2px; font-weight: 700; fill: #6c1f2b; }</style>
  <rect width="960" height="1040" fill="#fbf8f0"/>
  <text x="40" y="45" class="eyebrow">ARCHITECTURE / CONCEPTUAL OVERVIEW</text>
  <text x="40" y="89" fill="#48131c" font-family="Arial, sans-serif" font-size="36" font-weight="700">TaskFlow</text>
  <text x="40" y="125" class="detail">Role-separated collaboration with controlled access to business data.</text>
  <rect x="40" y="160" width="880" height="120" rx="16" fill="#fffdf8" stroke="#cfc6b7" stroke-width="2"/>
  <text x="64" y="197" class="label">Administrators / Managers / Collaborators</text>
  <text x="64" y="229" class="detail">Account administration is separate from business data access.</text>
  <path d="M480 280 V320" fill="none" stroke="#6c1f2b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="160" y="330" width="640" height="125" rx="16" fill="#f1eddf" stroke="#73744b" stroke-width="2"/>
  <text x="184" y="367" class="label">Angular frontend / Vercel</text>
  <text x="184" y="399" class="detail">Standalone components, Signals, lazy routing</text>
  <text x="184" y="426" class="detail">Task assignment, deadlines, and progress</text>
  <path d="M480 455 V505" fill="none" stroke="#6c1f2b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="80" y="515" width="800" height="195" rx="16" fill="#f1eddf" stroke="#73744b" stroke-width="2"/>
  <text x="104" y="552" class="label">Spring Boot REST API / Render</text>
  <text x="104" y="584" class="detail">Spring Security: roles and access controls</text>
  <text x="104" y="611" class="detail">HttpOnly JWT cookies · CSRF / CORS · TOTP MFA</text>
  <text x="104" y="638" class="detail">Session revocation and security event logging</text>
  <path d="M240 710 V780" fill="none" stroke="#6c1f2b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 710 V780" fill="none" stroke="#6c1f2b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M720 710 V780" fill="none" stroke="#6c1f2b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="40" y="790" width="280" height="150" rx="16" fill="#fffdf8" stroke="#cfc6b7" stroke-width="2"/>
  <text x="64" y="827" class="label">PostgreSQL</text>
  <text x="64" y="859" class="detail">Business data</text>
  <text x="64" y="886" class="detail">Flyway migrations</text>
  <rect x="340" y="790" width="280" height="150" rx="16" fill="#fffdf8" stroke="#cfc6b7" stroke-width="2"/>
  <text x="364" y="827" class="label">Supabase</text>
  <text x="364" y="859" class="detail">Private storage</text>
  <text x="364" y="886" class="detail">Task attachments</text>
  <rect x="640" y="790" width="280" height="150" rx="16" fill="#fffdf8" stroke="#cfc6b7" stroke-width="2"/>
  <text x="664" y="827" class="label">Gmail API</text>
  <text x="664" y="859" class="detail">Transactional email</text>
  <text x="664" y="886" class="detail">Invitations / recovery</text>
  <text x="40" y="1012" class="detail">Synthesized from the project description.</text>
